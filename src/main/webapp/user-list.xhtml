<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>TapWallet - Users</title>
    <h:outputStylesheet library="css" name="styles.css"/>
</h:head>
<h:body>
    <f:view>
        <h1>Users</h1>
        <div class="nav">
            <h:link outcome="index" value="Home"/>
            <h:link outcome="user-list" value="Users"/>
            <h:link outcome="wallet-list" value="Wallets"/>
            <h:link outcome="merchant-list" value="Merchants"/>
            <h:link outcome="card-list" value="Cards"/>
            <h:link outcome="transaction-list" value="Payments"/>
            <h:link outcome="topup-list" value="Top-Ups"/>
            <h:link outcome="withdrawal-list" value="Withdrawals"/>
        </div>
        <div class="page-actions">
            <h:link outcome="user-form" value="+ Add New User" styleClass="btn-add"/>
        </div>
        <div class="table-container">
            <h:form>
                <h:messages globalOnly="true" style="color : red"/>
                <h:dataTable value="#{userBean.allUsers}" var="u" border="1">
                    <h:column>
                        <f:facet name="header">Full Name</f:facet>
                        #{u.fullName}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Email</f:facet>
                        #{u.email}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Phone</f:facet>
                        #{u.phone}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Status</f:facet>
                        <span style="font-weight:bold">#{u.status}</span>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Actions</f:facet>
                        <h:link outcome="user-form" value="Edit" styleClass="btn-link">
                            <f:param name="id" value="#{u.id}"/>
                        </h:link>
                        &#160;|&#160;
                        <h:commandLink value="Delete" action="#{userBean.delete(u.id)}" styleClass="btn-danger"
                                       onclick="return confirm('Delete this user?');"/>
                    </h:column>
                </h:dataTable>
                <h:outputText value="No users yet. Register the first one to get a wallet started." rendered="#{empty userBean.allUsers}" styleClass="empty-state"/>
            </h:form>
        </div>
    </f:view>
</h:body>
</html>
