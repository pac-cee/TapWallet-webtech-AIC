<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>TapWallet - Send Payment</title>
    <h:outputStylesheet library="css" name="styles.css"/>
</h:head>
<h:body>
    <f:view>
        <h1>Send Payment</h1>
        <div class="nav">
            <h:link outcome="transaction-list" value="Back to Payments"/>
        </div>

        <div class="form-container">
            <h:form>
                <h:messages globalOnly="true" style="color : red"/>
                <h:panelGrid columns="3">
                    <h:outputLabel value="From Wallet" for="sender"/>
                    <h:selectOneMenu id="sender" value="#{transactionBean.senderWalletId}" required="true" label="From Wallet">
                        <f:selectItems value="#{transactionBean.allWalletsForDropdown}" var="w"
                                       itemValue="#{w.id}" itemLabel="#{w.owner.fullName} - #{w.balance} #{w.currency}"/>
                    </h:selectOneMenu>
                    <h:message for="sender" style="color : red"/>

                    <h:outputLabel value="To Merchant" for="merchant"/>
                    <h:selectOneMenu id="merchant" value="#{transactionBean.merchantId}" required="true" label="To Merchant">
                        <f:selectItems value="#{transactionBean.activeMerchantsForDropdown}" var="m"
                                       itemValue="#{m.id}" itemLabel="#{m.businessName} (#{m.merchantCode})"/>
                    </h:selectOneMenu>
                    <h:message for="merchant" style="color : red"/>

                    <h:outputLabel value="Amount" for="amount"/>
                    <h:inputText id="amount" value="#{transactionBean.amount}" required="true" label="Amount">
                        <f:validateDoubleRange minimum="0.01"/>
                    </h:inputText>
                    <h:message for="amount" style="color : red"/>

                    <h:commandButton value="Send" action="#{transactionBean.save()}"/>
                </h:panelGrid>
            </h:form>
        </div>
    </f:view>
</h:body>
</html>
