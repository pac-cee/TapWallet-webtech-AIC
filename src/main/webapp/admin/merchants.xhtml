<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:composition template="/WEB-INF/templates/main.xhtml">

    <ui:define name="title">TapWallet &#8212; Merchants</ui:define>
    <ui:define name="heading">Merchants</ui:define>

    <ui:define name="content">
        <div class="actions">
            <h:link outcome="/admin/merchant-form.xhtml" value="+ Add merchant" styleClass="btn-primary"/>
        </div>

        <div class="card">
            <h:form>
                <h:dataTable value="#{merchantAdmin.merchants}" var="m" styleClass="grid">
                    <h:column>
                        <f:facet name="header">Business</f:facet>
                        #{m.businessName}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Code</f:facet>
                        <span class="tag">#{m.code.value}</span>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Operator</f:facet>
                        #{m.operator.fullName}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Revenue</f:facet>
                        #{m.revenue}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Status</f:facet>
                        <span class="#{m.status.active ? 'badge-active' : 'badge-frozen'}">#{m.status.label}</span>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Actions</f:facet>
                        <h:link outcome="/admin/merchant-form.xhtml" value="Edit" styleClass="link-edit">
                            <f:param name="id" value="#{m.id}"/>
                        </h:link>
                        <h:commandLink value="Delete" action="#{merchantAdmin.delete(m.id)}" styleClass="link-delete"
                                       onclick="return confirm('Delete this merchant?');"/>
                    </h:column>
                </h:dataTable>
                <h:outputText value="No merchants yet." rendered="#{empty merchantAdmin.merchants}" styleClass="empty"/>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
</html>
