<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>TapWallet - New Top-Up</title>
    <h:outputStylesheet library="css" name="styles.css"/>
</h:head>
<h:body>
    <f:view>
        <h1>New Top-Up</h1>
        <div class="nav">
            <h:link outcome="topup-list" value="Back to Top-Ups"/>
        </div>

        <div class="form-container">
            <h:form>
                <h:messages globalOnly="true" style="color : red"/>
                <h:panelGrid columns="3">
                    <h:outputLabel value="Wallet" for="wallet"/>
                    <h:selectOneMenu id="wallet" value="#{topUpBean.walletId}" required="true" label="Wallet">
                        <f:selectItems value="#{topUpBean.allWalletsForDropdown}" var="w"
                                       itemValue="#{w.id}" itemLabel="#{w.owner.fullName} - #{w.balance} #{w.currency}"/>
                    </h:selectOneMenu>
                    <h:message for="wallet" style="color : red"/>

                    <h:outputLabel value="Amount" for="amount"/>
                    <h:inputText id="amount" value="#{topUpBean.amount}" required="true" label="Amount">
                        <f:validateDoubleRange minimum="0.01"/>
                    </h:inputText>
                    <h:message for="amount" style="color : red"/>

                    <h:outputLabel value="Method" for="method"/>
                    <h:selectOneMenu id="method" value="#{topUpBean.method}">
                        <f:selectItem itemValue="MOMO" itemLabel="MoMo"/>
                        <f:selectItem itemValue="CARD" itemLabel="Card"/>
                        <f:selectItem itemValue="BANK" itemLabel="Bank"/>
                    </h:selectOneMenu>
                    <h:message for="method" style="color : red"/>

                    <h:commandButton value="Top Up" action="#{topUpBean.save()}"/>
                </h:panelGrid>
            </h:form>
        </div>
    </f:view>
</h:body>
</html>
