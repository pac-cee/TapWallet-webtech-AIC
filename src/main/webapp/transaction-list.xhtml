<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>TapWallet - Payments</title>
    <h:outputStylesheet library="css" name="styles.css"/>
</h:head>
<h:body>
    <f:view>
        <h1>Payments</h1>
        <div class="nav">
            <h:link outcome="index" value="Home"/>
            <h:link outcome="wallet-list" value="Manage Wallets"/>
            <h:link outcome="transaction-form" value="Send Payment"/>
        </div>
        <div class="table-container">
            <h:form>
                <h:messages globalOnly="true" style="color : red"/>
                <h:dataTable value="#{transactionBean.allTransactions}" var="t" border="1">
                    <h:column>
                        <f:facet name="header">From</f:facet>
                        #{t.senderWallet.owner.fullName}
                    </h:column>
                    <h:column>
                        <f:facet name="header">To</f:facet>
                        #{t.receiverWallet.owner.fullName}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Amount</f:facet>
                        #{t.amount}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Type</f:facet>
                        #{t.type}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Action</f:facet>
                        <h:commandLink value="Reverse" action="#{transactionBean.delete(t.id)}" styleClass="btn-danger"
                                       onclick="return confirm('Reverse this payment? Balances move back.');"/>
                    </h:column>
                </h:dataTable>
                <h:outputText value="No payments yet. Top up two wallets, then send one." rendered="#{empty transactionBean.allTransactions}" style="color:#6b756d"/>
            </h:form>
        </div>
    </f:view>
</h:body>
</html>
