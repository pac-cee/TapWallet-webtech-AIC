<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:composition template="/WEB-INF/templates/main.xhtml">

    <ui:define name="title">TapWallet &#8212; Sign in</ui:define>
    <ui:define name="heading">Sign in to TapWallet</ui:define>

    <ui:define name="content">
        <div class="card card-narrow">
            <h:form>
                <h:panelGrid columns="3" styleClass="form-grid">
                    <h:outputLabel value="Email" for="email"/>
                    <h:inputText id="email" value="#{loginBean.email}" required="true"
                                 requiredMessage="Email is required" label="Email"/>
                    <h:message for="email" style="color : #b00020"/>

                    <h:outputLabel value="Password" for="password"/>
                    <h:inputSecret id="password" value="#{loginBean.password}" required="true"
                                   requiredMessage="Password is required" label="Password"/>
                    <h:message for="password" style="color : #b00020"/>
                </h:panelGrid>

                <h:commandButton value="Sign in" action="#{loginBean.signIn}" styleClass="btn-primary"/>
            </h:form>
        </div>

        <div class="card card-narrow demo-accounts">
            <h3>Demo accounts</h3>
            <table>
                <tr><th>Role</th><th>Email</th><th>Password</th></tr>
                <tr><td>Administrator</td><td>admin@tapwallet.rw</td><td>Admin@123</td></tr>
                <tr><td>Customer</td><td>alice@tapwallet.rw</td><td>Pass@123</td></tr>
                <tr><td>Customer</td><td>eric@tapwallet.rw</td><td>Pass@123</td></tr>
                <tr><td>Merchant</td><td>cafe@tapwallet.rw</td><td>Pass@123</td></tr>
                <tr><td>Merchant</td><td>shop@tapwallet.rw</td><td>Pass@123</td></tr>
            </table>
        </div>
    </ui:define>

</ui:composition>
</html>
