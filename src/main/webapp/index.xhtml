<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:composition template="/WEB-INF/templates/main.xhtml">

    <ui:define name="title">TapWallet</ui:define>
    <ui:define name="heading">TapWallet &#8212; Digital Wallet &amp; Merchant Payments</ui:define>

    <ui:define name="content">
        <div class="card card-narrow">
            <ui:fragment rendered="#{not userSession.signedIn}">
                <p>Customers hold a wallet and pay registered merchants. Merchants see what they
                    were paid. Administrators manage both.</p>
                <h:link outcome="/login.xhtml" value="Sign in" styleClass="btn-primary"/>
            </ui:fragment>

            <ui:fragment rendered="#{userSession.signedIn}">
                <p>You are signed in as <strong>#{userSession.fullName}</strong> (#{userSession.roleLabel}).</p>
                <h:link outcome="#{userSession.homePage}" value="Go to my dashboard" styleClass="btn-primary"/>
            </ui:fragment>
        </div>
    </ui:define>

</ui:composition>
</html>
