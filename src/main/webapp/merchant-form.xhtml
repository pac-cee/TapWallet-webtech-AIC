<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>TapWallet - Merchant Form</title>
    <h:outputStylesheet library="css" name="styles.css"/>
</h:head>
<h:body>
    <f:view>
        <f:metadata>
            <f:viewParam name="id" value="#{merchantBean.id}"/>
            <f:event type="preRenderView" listener="#{merchantBean.loadForEdit}"/>
        </f:metadata>

        <h1>#{merchantBean.id == null ? 'Register Shop' : 'Edit Shop'}</h1>
        <div class="nav">
            <h:link outcome="merchant-list" value="Back to Merchants"/>
        </div>

        <div class="form-container">
            <h:form>
                <h:messages globalOnly="true" style="color : red"/>
                <h:panelGrid columns="3">
                    <h:outputLabel value="Business Name" for="businessName"/>
                    <h:inputText id="businessName" value="#{merchantBean.businessName}" required="true" label="Business Name">
                        <f:validateLength minimum="3" maximum="80"/>
                    </h:inputText>
                    <h:message for="businessName" style="color : red"/>

                    <h:outputLabel value="Merchant Code" for="merchantCode"/>
                    <h:inputText id="merchantCode" value="#{merchantBean.merchantCode}" required="true" label="Merchant Code">
                        <f:validateLength minimum="4" maximum="20"/>
                    </h:inputText>
                    <h:message for="merchantCode" style="color : red"/>

                    <h:outputLabel value="Operator" for="operator"/>
                    <h:selectOneMenu id="operator" value="#{merchantBean.operatorId}" required="true" label="Operator">
                        <f:selectItems value="#{merchantBean.allUsersForDropdown}" var="u"
                                       itemValue="#{u.id}" itemLabel="#{u.fullName}"/>
                    </h:selectOneMenu>
                    <h:message for="operator" style="color : red"/>

                    <h:outputLabel value="Status" for="status"/>
                    <h:selectOneMenu id="status" value="#{merchantBean.status}">
                        <f:selectItem itemValue="ACTIVE" itemLabel="Active"/>
                        <f:selectItem itemValue="FROZEN" itemLabel="Frozen"/>
                    </h:selectOneMenu>
                    <h:message for="status" style="color : red"/>

                    <h:commandButton value="Save" action="#{merchantBean.save()}"/>
                </h:panelGrid>
            </h:form>
        </div>
    </f:view>
</h:body>
</html>
