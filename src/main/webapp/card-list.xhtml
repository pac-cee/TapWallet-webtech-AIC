<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>TapWallet - NFC Cards</title>
    <h:outputStylesheet library="css" name="styles.css"/>
</h:head>
<h:body>
    <f:view>
        <h1>NFC Cards</h1>
        <div class="nav">
            <h:link outcome="index" value="Home"/>
            <h:link outcome="wallet-list" value="Manage Wallets"/>
            <h:link outcome="card-form" value="Link New Card"/>
        </div>
        <div class="table-container">
            <h:form>
                <h:dataTable value="#{nfcCardBean.allCards}" var="c" border="1">
                    <h:column>
                        <f:facet name="header">Token</f:facet>
                        #{c.token}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Wallet Owner</f:facet>
                        #{c.wallet.owner.fullName}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Status</f:facet>
                        <span style="font-weight:bold">#{c.status}</span>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Actions</f:facet>
                        <h:link outcome="card-form" value="Edit" styleClass="btn-link">
                            <f:param name="id" value="#{c.id}"/>
                        </h:link>
                        &#160;|&#160;
                        <h:commandLink value="Delete" action="#{nfcCardBean.delete(c.id)}" styleClass="btn-danger"
                                       onclick="return confirm('Unlink this card?');"/>
                    </h:column>
                </h:dataTable>
                <h:outputText value="No cards linked yet." rendered="#{empty nfcCardBean.allCards}" style="color:#6b756d"/>
            </h:form>
        </div>
    </f:view>
</h:body>
</html>
