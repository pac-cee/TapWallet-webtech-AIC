<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:composition template="/WEB-INF/templates/main.xhtml">

    <ui:define name="title">TapWallet &#8212; My wallet</ui:define>
    <ui:define name="heading">My wallet</ui:define>

    <ui:define name="head">
        <style type="text/css">
            .balance-card {
                background-color: #1f3a5f;
                color: #ffffff;
                border-radius: 8px;
                padding: 24px 26px;
                margin-bottom: 18px;
            }
            .balance-label {
                text-transform: uppercase;
                letter-spacing: 0.08em;
                font-size: 12px;
                opacity: 0.8;
            }
            .balance-amount {
                font-size: 34px;
                font-weight: bold;
                margin-top: 6px;
            }
        </style>
    </ui:define>

    <ui:define name="content">
        <ui:fragment rendered="#{not empty customerWallet.wallet}">
            <div class="balance-card">
                <div class="balance-label">Available balance</div>
                <div class="balance-amount">#{customerWallet.wallet.balance}</div>
                <div style="margin-top : 8px; font-size : 13px">
                    Status: #{customerWallet.wallet.status.label}
                </div>
            </div>

            <div class="card card-narrow">
                <h3>Top up</h3>
                <h:form>
                    <h:panelGrid columns="3" styleClass="form-grid">
                        <h:outputLabel value="Amount" for="amount"/>
                        <h:inputText id="amount" value="#{customerWallet.topUpAmount}" required="true" label="Amount">
                            <f:validateDoubleRange minimum="1.0"/>
                        </h:inputText>
                        <h:message for="amount" style="color : #b00020"/>
                    </h:panelGrid>
                    <h:commandButton value="Add money" action="#{customerWallet.topUp}" styleClass="btn-primary"/>
                </h:form>
            </div>
        </ui:fragment>

        <ui:fragment rendered="#{empty customerWallet.wallet}">
            <div class="card card-narrow">
                <p>You do not have a wallet yet. Ask an administrator to open one for you.</p>
            </div>
        </ui:fragment>
    </ui:define>

</ui:composition>
</html>
