<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:composition template="/WEB-INF/templates/main.xhtml">

    <ui:define name="title">TapWallet &#8212; My payments</ui:define>
    <ui:define name="heading">My payments</ui:define>

    <ui:define name="content">
        <div class="card">
            <h:form>
                <h:dataTable value="#{customerPayment.myPayments}" var="p" styleClass="grid">
                    <h:column>
                        <f:facet name="header">Reference</f:facet>
                        <span class="tag">#{p.reference}</span>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Paid to</f:facet>
                        #{p.merchant.businessName}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Amount</f:facet>
                        #{p.amount}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Status</f:facet>
                        <span class="#{p.reversed ? 'badge-frozen' : 'badge-active'}">#{p.status.label}</span>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Date</f:facet>
                        #{p.createdAt}
                    </h:column>
                </h:dataTable>
                <h:outputText value="You have not paid anyone yet." rendered="#{empty customerPayment.myPayments}"
                              styleClass="empty"/>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
</html>
